name: Fetch London weather data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/fetch-weather.yml'
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

permissions:
  contents: write

concurrency:
  group: fetch-weather
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch and process
        env:
          CEDA_USERNAME: ${{ secrets.CEDA_USERNAME }}
          CEDA_PASSWORD: ${{ secrets.CEDA_PASSWORD }}
        run: python pipeline/fetch_weather.py
      - name: Commit data if changed
        run: |
          git config user.name "heatwise-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update London weather data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
